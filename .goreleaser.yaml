project_name: ygglazy
version: 2
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

brews:
  - repository:
      owner: Y-Akamirsky
      name: homebrew-ygg-lazy-cli
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

    homepage: "https://github.com/Y-Akamirsky/ygg-lazy-cli"
    description: "Lazy-way CLI Yggdrasil Network configurator"
    test: |
      system "#{bin}/ygglazy -h"
    install: |
      bin.install "ygglazy"
